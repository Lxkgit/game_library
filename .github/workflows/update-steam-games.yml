name: Update Steam Games

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'public/steam-games.json'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update Steam data
        run: node scripts/update-steam-games.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- public/steam-games.json; then
            echo 'Steam 游戏数据没有变化'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/steam-games.json
          git commit -m 'chore: update Steam games data'
          git push
